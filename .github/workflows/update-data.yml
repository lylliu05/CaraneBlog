name: Update project data

# 每次 push 到 main 时：自动扫描 docs/ 与 downloads/，重新生成 js/data.js 并回推。
# 之后 GitHub Pages 从 main 分支自动发布，网页即自动更新。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate js/data.js from docs/ and downloads/
        run: node scripts/generate-data.cjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          if git diff --cached --quiet; then
            echo "data.js 已是最新，无需提交"
          else
            git commit -m "chore: auto-regenerate js/data.js [skip ci]"
            git push
          fi
