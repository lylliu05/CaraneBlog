name: Update project data

# 每次 push 到 main 时：自动扫描 docs/、downloads/ 与 recommend/，
# 重新生成 js/data.js、js/recommend-data.js（网页数据）与 apps.json（App 检查更新接口）并回推。
# 之后 GitHub Pages 从 main 分支自动发布，网页与更新接口即自动更新。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate js/data.js from docs/ and downloads/
        run: node scripts/generate-data.cjs

      - name: Generate js/recommend-data.js from recommend/
        run: node scripts/generate-recommend.cjs

      - name: Generate apps.json from downloads/*.apk
        run: node scripts/generate-apps-json.cjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js js/recommend-data.js apps.json
          if git diff --cached --quiet; then
            echo "data.js、recommend-data.js 与 apps.json 已是最新，无需提交"
          else
            git commit -m "chore: auto-regenerate js/data.js, js/recommend-data.js and apps.json [skip ci]"
            git push
          fi
